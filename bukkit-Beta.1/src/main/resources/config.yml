# ============================================================
#  MCPanelRestart v1.1 - 定时重启服务器 + TPS 卡顿保护
#  默认：每天 04:00 重启，并在 03:00 / 03:30 / 03:45 / 03:50 / 03:55 提前通知
#  修改后执行 /restart reload 生效
# ============================================================
restart:
  # 是否启用每日定时重启
  enabled: true
  # 每天几点几分重启（24 小时制）
  time: "04:00"
  # 重启前多少秒开始强制踢人/关服（到了时间按顺序执行 save-all → 踢人 → 关服）
  # 注意：关服后需要你的启动脚本/面板重新拉起服务器，插件本身无法开机后自启
  shutdown-delay-seconds: 5

# ============================================================
#  TPS 卡顿保护（1.1 新增）
#  TPS 持续低于阈值时自动倒计时重启，重启后 TPS 通常会恢复
# ============================================================
tps-guard:
  # 是否启用
  enabled: true
  # TPS 低于该值开始计时（Paper 默认满 TPS = 20）
  threshold: 10.0
  # 连续低于 threshold 多少秒才触发（避免瞬时卡顿误判）
  duration-seconds: 120
  # TPS 回到该值以上就清零计时（略高于 threshold，防抖动）
  recover-tps: 15.0
  # 触发后给玩家多少秒准备时间再重启
  countdown-seconds: 60
  # 两次 TPS 自动重启的最小间隔（分钟），防止连环重启
  cooldown-minutes: 30
  # 服务器启动后多少秒内不检查 TPS（加载区块时 TPS 天然很低）
  warmup-seconds: 120
  # 触发时的提示文案，%tps% = 当前 TPS，%time% = 剩余时间
  message: "&c&l[服务器公告] &r服务器卡顿严重（TPS 仅 %tps%），将在 &c%time%&r 后自动重启以恢复正常。"
  # 是否使用 Paper 的静默踢人（不刷被踢提示）
  quiet-kick: true

# 提前通知时间点与文案（按顺序发送，可加任意条）
# 占位符：%time% 距离重启还有多久（如 "1 小时"、"5 分钟"、"30 秒"）
notify:
  - at: "03:00"
    message: "&e&l[服务器公告] &r服务器将在 &c1 小时&r 后（&c04:00&r）重启维护，请提前保存进度。"
  - at: "03:30"
    message: "&e&l[服务器公告] &r服务器将在 &c30 分钟&r 后（&c04:00&r）重启，请尽快结束当前活动。"
  - at: "03:45"
    message: "&e&l[服务器公告] &r服务器将在 &c15 分钟&r 后重启，请回到安全位置。"
  - at: "03:50"
    message: "&e&l[服务器公告] &r服务器将在 &c10 分钟&r 后重启。"
  - at: "03:55"
    message: "&c&l[服务器公告] &r服务器将在 &c5 分钟&r 后重启，请做好准备，重启后将自动恢复。"
  - at: "03:59"
    message: "&c&l[服务器公告] &r服务器将在 &c1 分钟&r 后重启！"

# 重启倒计时最后阶段（秒）：从第几秒开始逐秒提示，0 = 关闭
countdown:
  from: 10
  title: "&c&l%time%"
  chat: "&c服务器将在 %time% 秒后重启"

# 手动 /restart 时的默认倒计时（秒）
manual-default-seconds: 60
manual-message: "&c&l[服务器公告] &r管理员将在 &c%time%&r 后重启服务器。"

# 重启后的提示（服务器重新启动、玩家进来时发）
welcome-back:
  enabled: true
  message: "&a&l[服务器公告] &r服务器已重启完成，欢迎回来！"
